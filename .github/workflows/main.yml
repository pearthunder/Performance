name: JMeter Performance Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'JMeter test file pattern (e.g., AAA.jmx or *.jmx for all)'
        required: false
        default: '*.jmx'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  discover-tests:
    name: Discover JMeter Test Files
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.find-tests.outputs.test_files }}
      test_count: ${{ steps.find-tests.outputs.test_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find JMeter test files
        id: find-tests
        run: |
          PATTERN="${{ github.event.inputs.test_pattern || '*.jmx' }}"
          
          # Find all .jmx files, excluding backup directories
          if [[ "$PATTERN" == "*.jmx" ]]; then
            # Find all JMX files excluding apache-jmeter directories
            FILES=$(find . -name "*.jmx" -not -path "*/apache-jmeter-*/*" -not -path "*/.git/*" | sort)
          else
            # Specific file pattern
            FILES=$(find . -name "$PATTERN" -not -path "*/apache-jmeter-*/*" -not -path "*/.git/*" | sort)
          fi
          
          if [ -z "$FILES" ]; then
            echo "❌ No JMeter test files found matching pattern: $PATTERN"
            exit 1
          fi
          
          # Convert to JSON array for output
          JSON_FILES=$(echo "$FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "test_files=$JSON_FILES" >> $GITHUB_OUTPUT
          
          echo "Found JMeter test files:"
          echo "$FILES" | while read -r file; do
            echo "  - $file"
          done
          
          COUNT=$(echo "$FILES" | grep -c . || echo "0")
          echo "test_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Total test files: $COUNT"

  jmeter-tests:
    name: Run JMeter Performance Tests
    needs: discover-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # This job will fail if any matrix job fails, ensuring test failures are visible
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.discover-tests.outputs.test_files) }}
    
    container:
      # Using lightweight Alpine-based JMeter image (justb4/jmeter)
      # Alternative: justb4/jmeter:5.6.3 for specific version
      image: justb4/jmeter:latest
      options: --user root
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare test environment
        id: prepare
        run: |
          TEST_FILE="${{ matrix.test_file }}"
          TEST_NAME=$(basename "$TEST_FILE" .jmx)
          
          # Generate timestamp in format: YYYYMMDD-HHMMSS (filesystem-safe) for HTML reports only
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TIMESTAMP_READABLE=$(date +"%Y-%m-%d %H:%M:%S")
          
          # JTL file: no timestamp - accumulates/overwrites for each test
          # This allows tracking the latest results while keeping history
          JTL_FILE="reports/${TEST_NAME}.jtl"
          
          # HTML report directory: timestamped - incremental, doesn't overwrite previous runs
          REPORT_DIR="reports/${TEST_NAME}_${TIMESTAMP}"
          
          ARTIFACT_NAME="jmeter-report-${TEST_NAME}-${TIMESTAMP}"
          
          echo "TEST_NAME=$TEST_NAME" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
          echo "JTL_FILE=$JTL_FILE" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          
          echo "test_name=$TEST_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
          echo "jtl_file=$JTL_FILE" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          
          echo "Running test: $TEST_FILE"
          echo "Timestamp: $TIMESTAMP_READABLE ($TIMESTAMP)"
          echo "JTL file (accumulated): $JTL_FILE"
          echo "HTML report directory (timestamped): $REPORT_DIR"
          
          # Create parent reports directory if it doesn't exist
          # But don't create the report directory itself - JMeter needs it empty
          mkdir -p reports

      - name: Run JMeter test
        id: jmeter
        run: |
          TEST_FILE="${{ matrix.test_file }}"
          REPORT_DIR="${{ steps.prepare.outputs.report_dir }}"
          JTL_FILE="${{ steps.prepare.outputs.jtl_file }}"
          TEST_NAME="${{ steps.prepare.outputs.test_name }}"
          TIMESTAMP="${{ steps.prepare.outputs.timestamp }}"
          
          # Use temporary location for log file (not in report directory)
          # JMeter requires the report directory to be completely empty when using -o flag
          LOG_FILE="reports/${TEST_NAME}_${TIMESTAMP}.log"
          
          echo "🚀 Starting JMeter test: $TEST_FILE"
          echo "JTL file (accumulated, no timestamp): $JTL_FILE"
          echo "HTML report directory (timestamped, will be created by JMeter): $REPORT_DIR"
          echo "Log file (temporary location): $LOG_FILE"
          
          # Run JMeter in non-GUI mode with HTML report generation
          # Note: JMeter will create the REPORT_DIR itself and it must be empty
          # JTL file is written directly to its final location (no timestamp, accumulates)
          set +e  # Don't exit on error immediately
          jmeter \
            -n \
            -t "$TEST_FILE" \
            -l "$JTL_FILE" \
            -f \
            -e \
            -o "$REPORT_DIR" \
            -j "$LOG_FILE"
          EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          # Move log file into report directory after JMeter creates it
          if [ -d "$REPORT_DIR" ] && [ -f "$LOG_FILE" ]; then
            mv "$LOG_FILE" "$REPORT_DIR/jmeter.log"
            echo "✅ Moved log file to report directory"
          elif [ -f "$LOG_FILE" ]; then
            echo "⚠️ Warning: Report directory not created, keeping log in parent directory"
          fi
          
          # Check if JTL file was created
          if [ -f "$JTL_FILE" ]; then
            echo "✅ JTL file generated (accumulated): $JTL_FILE"
            echo "File size: $(du -h "$JTL_FILE" | cut -f1)"
          else
            echo "⚠️ Warning: JTL file not found at $JTL_FILE"
          fi
          
          # Check if report directory has content
          if [ -d "$REPORT_DIR" ] && [ "$(ls -A $REPORT_DIR)" ]; then
            echo "✅ Report directory populated: $REPORT_DIR"
            echo "Report contents:"
            ls -lh "$REPORT_DIR" | head -20
          else
            echo "⚠️ Warning: Report directory is empty or missing"
          fi
          
          # Store exit code for later use
          echo "test_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "test_failed=$([ $EXIT_CODE -ne 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          # Exit with error code if test failed (but allow job to continue for artifact collection)
          exit $EXIT_CODE
        continue-on-error: true

      - name: Check error rate from JTL file
        id: check-error-rate
        if: always()
        run: |
          JTL_FILE="${{ steps.prepare.outputs.jtl_file }}"
          TEST_NAME="${{ steps.prepare.outputs.test_name }}"
          
          echo "📊 Analyzing error rate from JTL file: $JTL_FILE"
          
          if [ ! -f "$JTL_FILE" ]; then
            echo "⚠️ Warning: JTL file not found, cannot check error rate"
            echo "error_rate_check=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Parse JTL file to count errors
          # JTL format: CSV with columns including success (true/false) or errorCount
          # Count total samples (excluding header line)
          TOTAL_SAMPLES=$(tail -n +2 "$JTL_FILE" | wc -l | tr -d ' ')
          
          if [ "$TOTAL_SAMPLES" -eq 0 ]; then
            echo "⚠️ Warning: No samples found in JTL file"
            echo "error_rate_check=skipped" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Count failed samples
          # Check for success=false or errorCount>0 depending on JTL format
          # Try to detect format and count failures accordingly
          FAILED_SAMPLES=0
          
          # Method 1: Check for success column (CSV format)
          if head -1 "$JTL_FILE" | grep -q "success"; then
            # Find column index for 'success'
            SUCCESS_COL=$(head -1 "$JTL_FILE" | tr ',' '\n' | grep -n "success" | cut -d: -f1)
            if [ -n "$SUCCESS_COL" ]; then
              FAILED_SAMPLES=$(tail -n +2 "$JTL_FILE" | awk -F',' -v col="$SUCCESS_COL" 'tolower($col) == "false" {count++} END {print count+0}')
            fi
          fi
          
          # Method 2: If no success column, check for errorCount or responseCode != 200
          if [ "$FAILED_SAMPLES" -eq 0 ] && head -1 "$JTL_FILE" | grep -q "errorCount"; then
            ERROR_COL=$(head -1 "$JTL_FILE" | tr ',' '\n' | grep -n "errorCount" | cut -d: -f1)
            if [ -n "$ERROR_COL" ]; then
              FAILED_SAMPLES=$(tail -n +2 "$JTL_FILE" | awk -F',' -v col="$ERROR_COL" '$col > 0 {count++} END {print count+0}')
            fi
          fi
          
          # Method 3: Check responseCode column (non-2xx codes are errors)
          if [ "$FAILED_SAMPLES" -eq 0 ] && head -1 "$JTL_FILE" | grep -q "responseCode"; then
            RESPONSE_COL=$(head -1 "$JTL_FILE" | tr ',' '\n' | grep -n "responseCode" | cut -d: -f1)
            if [ -n "$RESPONSE_COL" ]; then
              FAILED_SAMPLES=$(tail -n +2 "$JTL_FILE" | awk -F',' -v col="$RESPONSE_COL" '$col !~ /^2[0-9][0-9]$/ {count++} END {print count+0}')
            fi
          fi
          
          # Calculate error percentage
          if [ "$TOTAL_SAMPLES" -gt 0 ]; then
            # Use awk for precise floating point calculation
            ERROR_PERCENTAGE=$(awk "BEGIN {printf \"%.2f\", ($FAILED_SAMPLES / $TOTAL_SAMPLES) * 100}")
            ERROR_PERCENTAGE_INT=$(awk "BEGIN {printf \"%.0f\", ($FAILED_SAMPLES / $TOTAL_SAMPLES) * 100}")
          else
            ERROR_PERCENTAGE=0
            ERROR_PERCENTAGE_INT=0
          fi
          
          echo "📈 Test Results for $TEST_NAME:"
          echo "   Total samples: $TOTAL_SAMPLES"
          echo "   Failed samples: $FAILED_SAMPLES"
          echo "   Error rate: ${ERROR_PERCENTAGE}%"
          
          # Store results for summary
          echo "total_samples=$TOTAL_SAMPLES" >> $GITHUB_OUTPUT
          echo "failed_samples=$FAILED_SAMPLES" >> $GITHUB_OUTPUT
          echo "error_percentage=$ERROR_PERCENTAGE" >> $GITHUB_OUTPUT
          echo "error_rate_check=completed" >> $GITHUB_OUTPUT
          
          # Check error rate against thresholds:
          # - Passed: < 10% errors
          # - Unstable: 10% - 20% errors (job passes but marked as unstable)
          # - Failed: > 20% errors (job fails)
          WARNING_THRESHOLD=10
          FAILURE_THRESHOLD=20
          
          # Determine status based on error rate
          if [ "$ERROR_PERCENTAGE_INT" -gt "$FAILURE_THRESHOLD" ]; then
            # Failed: > 20% errors
            echo "❌ ERROR RATE EXCEEDED FAILURE THRESHOLD!"
            echo "   Error rate: ${ERROR_PERCENTAGE}% (Failure threshold: ${FAILURE_THRESHOLD}%)"
            echo "   Test: $TEST_NAME"
            echo "   Failed samples: $FAILED_SAMPLES out of $TOTAL_SAMPLES"
            echo "   Status: FAILED"
            echo "   This test will be marked as failed."
            echo "error_rate_status=failed" >> $GITHUB_OUTPUT
            echo "error_rate_exceeded=true" >> $GITHUB_OUTPUT
            exit 1
          elif [ "$ERROR_PERCENTAGE_INT" -ge "$WARNING_THRESHOLD" ]; then
            # Unstable: 10% - 20% errors
            echo "⚠️ ERROR RATE EXCEEDS WARNING THRESHOLD (UNSTABLE)"
            echo "   Error rate: ${ERROR_PERCENTAGE}% (Warning threshold: ${WARNING_THRESHOLD}%, Failure threshold: ${FAILURE_THRESHOLD}%)"
            echo "   Test: $TEST_NAME"
            echo "   Failed samples: $FAILED_SAMPLES out of $TOTAL_SAMPLES"
            echo "   Status: UNSTABLE"
            echo "   Job will pass but test is marked as unstable."
            echo "error_rate_status=unstable" >> $GITHUB_OUTPUT
            echo "error_rate_exceeded=false" >> $GITHUB_OUTPUT
            exit 0
          else
            # Passed: < 10% errors
            echo "✅ Error rate within acceptable threshold"
            echo "   Error rate: ${ERROR_PERCENTAGE}% (Warning threshold: ${WARNING_THRESHOLD}%)"
            echo "   Test: $TEST_NAME"
            echo "   Status: PASSED"
            echo "error_rate_status=passed" >> $GITHUB_OUTPUT
            echo "error_rate_exceeded=false" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Check test results
        if: steps.jmeter.outcome != 'success'
        run: |
          echo "❌ Test ${{ steps.prepare.outputs.test_name }} FAILED"
          echo "Exit code: ${{ steps.jmeter.outputs.test_exit_code }}"
          if [ -d "${{ steps.prepare.outputs.report_dir }}" ]; then
            echo "Reports available in: ${{ steps.prepare.outputs.report_dir }}"
            ls -la "${{ steps.prepare.outputs.report_dir }}/" || true
            # Show last few lines of JMeter log if available
            if [ -f "${{ steps.prepare.outputs.report_dir }}/jmeter.log" ]; then
              echo "Last 20 lines of JMeter log:"
              tail -20 "${{ steps.prepare.outputs.report_dir }}/jmeter.log" || true
            fi
          fi

      - name: Upload test reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-run${{ github.run_number }}
          path: |
            ${{ steps.prepare.outputs.report_dir }}/
            ${{ steps.prepare.outputs.jtl_file }}
          retention-days: 30
          if-no-files-found: warn

      - name: Mark job as failed if test failed
        # This step MUST run without continue-on-error to ensure the job fails when tests fail
        # Without this, continue-on-error: true on the JMeter step would mask failures
        # Also checks for error rate threshold violations (>20% = failed, 10-20% = unstable but passes)
        if: steps.jmeter.outcome != 'success' || (steps.check-error-rate.outcome == 'failure' && steps.check-error-rate.outputs.error_rate_status == 'failed')
        run: |
          TEST_NAME="${{ steps.prepare.outputs.test_name }}"
          echo "❌ Test $TEST_NAME failed."
          
          if [ "${{ steps.jmeter.outcome }}" != "success" ]; then
            echo "   Reason: JMeter execution failed"
            echo "   Exit code from JMeter: ${{ steps.jmeter.outputs.test_exit_code }}"
          fi
          
          if [ "${{ steps.check-error-rate.outputs.error_rate_status }}" == "failed" ]; then
            echo "   Reason: Error rate exceeded 20% failure threshold"
            echo "   Error rate: ${{ steps.check-error-rate.outputs.error_percentage }}%"
            echo "   Failed samples: ${{ steps.check-error-rate.outputs.failed_samples }} out of ${{ steps.check-error-rate.outputs.total_samples }}"
            echo "   Threshold: > 20% = FAILED"
          fi
          
          echo "Failing this job to ensure test failures are visible in the workflow result."
          exit 1

      - name: Report unstable test status
        # Report unstable status (10-20% error rate) without failing the job
        if: always() && steps.check-error-rate.outputs.error_rate_status == 'unstable'
        run: |
          TEST_NAME="${{ steps.prepare.outputs.test_name }}"
          echo "⚠️ Test $TEST_NAME is UNSTABLE"
          echo "   Error rate: ${{ steps.check-error-rate.outputs.error_percentage }}%"
          echo "   Failed samples: ${{ steps.check-error-rate.outputs.failed_samples }} out of ${{ steps.check-error-rate.outputs.total_samples }}"
          echo "   Status: UNSTABLE (10% - 20% error rate)"
          echo "   Job will pass but test quality is degraded."

  summary:
    name: Test Summary
    needs: [discover-tests, jmeter-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Display test summary
        run: |
          echo "## 📊 JMeter Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Tests Found:** ${{ needs.discover-tests.outputs.test_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Files Executed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ join(fromJson(needs.discover-tests.outputs.test_files), '\n') }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check the actual job result - this will now correctly reflect test failures
          if [ "${{ needs.jmeter-tests.result }}" == "success" ]; then
            echo "**Status:** ✅ All tests completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.jmeter-tests.result }}" == "failure" ]; then
            echo "**Status:** ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.jmeter-tests.result }}" == "cancelled" ]; then
            echo "**Status:** ⚠️ Tests were cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Tests completed with status: ${{ needs.jmeter-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available as separate artifacts for each test" >> $GITHUB_STEP_SUMMARY

