name: Test JMeter Action

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    
  workflow_dispatch:

jobs:
  action_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/SngleRun

      - name: Run JMeter Action on a test
        uses: rbhadti94/apache-jmeter-action@v0.5.0
        with:
          testFilePath: performance/AAA.jmx
          outputReportsFolder: reports/

