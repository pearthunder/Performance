name: JMeter Performance Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'JMeter test file pattern (e.g., AAA.jmx or *.jmx for all)'
        required: false
        default: '*.jmx'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  discover-tests:
    name: Discover JMeter Test Files
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.find-tests.outputs.test_files }}
      test_count: ${{ steps.find-tests.outputs.test_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find JMeter test files
        id: find-tests
        run: |
          PATTERN="${{ github.event.inputs.test_pattern || '*.jmx' }}"
          
          # Find all .jmx files, excluding backup directories
          if [[ "$PATTERN" == "*.jmx" ]]; then
            # Find all JMX files excluding apache-jmeter directories
            FILES=$(find . -name "*.jmx" -not -path "*/apache-jmeter-*/*" -not -path "*/.git/*" | sort)
          else
            # Specific file pattern
            FILES=$(find . -name "$PATTERN" -not -path "*/apache-jmeter-*/*" -not -path "*/.git/*" | sort)
          fi
          
          if [ -z "$FILES" ]; then
            echo "❌ No JMeter test files found matching pattern: $PATTERN"
            exit 1
          fi
          
          # Convert to JSON array for output
          JSON_FILES=$(echo "$FILES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "test_files=$JSON_FILES" >> $GITHUB_OUTPUT
          
          echo "Found JMeter test files:"
          echo "$FILES" | while read -r file; do
            echo "  - $file"
          done
          
          COUNT=$(echo "$FILES" | grep -c . || echo "0")
          echo "test_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Total test files: $COUNT"

  jmeter-tests:
    name: Run JMeter Performance Tests
    needs: discover-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # This job will fail if any matrix job fails, ensuring test failures are visible
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.discover-tests.outputs.test_files) }}
    
    container:
      # Using lightweight Alpine-based JMeter image (justb4/jmeter)
      # Alternative: justb4/jmeter:5.6.3 for specific version
      image: justb4/jmeter:latest
      options: --user root
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup previous test results
        run: |
          echo "🧹 Cleaning up previous test results and reports..."
          
          # Remove reports directory if it exists
          if [ -d "reports" ]; then
            echo "Removing reports directory..."
            rm -rf reports
            echo "✅ Reports directory cleaned"
          else
            echo "No reports directory found"
          fi
          
          # Remove results directory if it exists
          if [ -d "results" ]; then
            echo "Removing results directory..."
            rm -rf results
            echo "✅ Results directory cleaned"
          else
            echo "No results directory found"
          fi
          
          # Remove any stray JTL files in root
          if ls *.jtl 2>/dev/null; then
            echo "Removing JTL files from root..."
            rm -f *.jtl
            echo "✅ JTL files cleaned"
          else
            echo "No JTL files found in root"
          fi
          
          echo "✅ Cleanup completed"

      - name: Prepare test environment
        id: prepare
        run: |
          TEST_FILE="${{ matrix.test_file }}"
          TEST_NAME=$(basename "$TEST_FILE" .jmx)
          
          # Generate timestamp in format: YYYYMMDD-HHMMSS (filesystem-safe)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          TIMESTAMP_READABLE=$(date +"%Y-%m-%d %H:%M:%S")
          
          # Create timestamped directory and file names
          REPORT_DIR="reports/${TEST_NAME}_${TIMESTAMP}"
          # JTL file will be written to temp location first, then moved to report directory
          # This is because JMeter requires the report directory to be empty for -o flag
          JTL_FILE_TEMP="reports/${TEST_NAME}_${TIMESTAMP}.jtl"
          JTL_FILE="${REPORT_DIR}/${TEST_NAME}_${TIMESTAMP}.jtl"
          ARTIFACT_NAME="jmeter-report-${TEST_NAME}-${TIMESTAMP}"
          
          echo "TEST_NAME=$TEST_NAME" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
          echo "JTL_FILE_TEMP=$JTL_FILE_TEMP" >> $GITHUB_ENV
          echo "JTL_FILE=$JTL_FILE" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV
          
          echo "test_name=$TEST_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "report_dir=$REPORT_DIR" >> $GITHUB_OUTPUT
          echo "jtl_file_temp=$JTL_FILE_TEMP" >> $GITHUB_OUTPUT
          echo "jtl_file=$JTL_FILE" >> $GITHUB_OUTPUT
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          
          echo "Running test: $TEST_FILE"
          echo "Timestamp: $TIMESTAMP_READABLE ($TIMESTAMP)"
          echo "Report directory: $REPORT_DIR"
          echo "JTL file: $JTL_FILE"
          
          # Create parent reports directory if it doesn't exist
          # But don't create the report directory itself - JMeter needs it empty
          mkdir -p reports

      - name: Run JMeter test
        id: jmeter
        run: |
          TEST_FILE="${{ matrix.test_file }}"
          REPORT_DIR="${{ steps.prepare.outputs.report_dir }}"
          JTL_FILE_TEMP="${{ steps.prepare.outputs.jtl_file_temp }}"
          JTL_FILE="${{ steps.prepare.outputs.jtl_file }}"
          TEST_NAME="${{ steps.prepare.outputs.test_name }}"
          TIMESTAMP="${{ steps.prepare.outputs.timestamp }}"
          
          # Use temporary locations for log and JTL files (not in report directory)
          # JMeter requires the report directory to be completely empty when using -o flag
          LOG_FILE="reports/${TEST_NAME}_${TIMESTAMP}.log"
          
          echo "🚀 Starting JMeter test: $TEST_FILE"
          echo "Report directory (will be created by JMeter): $REPORT_DIR"
          echo "JTL file (temporary location): $JTL_FILE_TEMP"
          echo "Log file (temporary location): $LOG_FILE"
          
          # Run JMeter in non-GUI mode with HTML report generation
          # Note: JMeter will create the REPORT_DIR itself and it must be empty
          # We write JTL and log to temp locations to avoid creating the directory prematurely
          set +e  # Don't exit on error immediately
          jmeter \
            -n \
            -t "$TEST_FILE" \
            -l "$JTL_FILE_TEMP" \
            -e \
            -o "$REPORT_DIR" \
            -j "$LOG_FILE"
          EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          # Move JTL and log files into report directory after JMeter creates it
          if [ -d "$REPORT_DIR" ]; then
            if [ -f "$JTL_FILE_TEMP" ]; then
              mv "$JTL_FILE_TEMP" "$JTL_FILE"
              echo "✅ Moved JTL file to report directory: $JTL_FILE"
            fi
            if [ -f "$LOG_FILE" ]; then
              mv "$LOG_FILE" "$REPORT_DIR/jmeter.log"
              echo "✅ Moved log file to report directory"
            fi
          else
            echo "⚠️ Warning: Report directory not created by JMeter"
            if [ -f "$JTL_FILE_TEMP" ]; then
              echo "JTL file remains at: $JTL_FILE_TEMP"
            fi
            if [ -f "$LOG_FILE" ]; then
              echo "Log file remains at: $LOG_FILE"
            fi
          fi
          
          # Check if JTL file was created (check both temp and final locations)
          if [ -f "$JTL_FILE" ]; then
            echo "✅ JTL file generated: $JTL_FILE"
            echo "File size: $(du -h "$JTL_FILE" | cut -f1)"
          elif [ -f "$JTL_FILE_TEMP" ]; then
            echo "✅ JTL file generated (temp location): $JTL_FILE_TEMP"
            echo "File size: $(du -h "$JTL_FILE_TEMP" | cut -f1)"
          else
            echo "⚠️ Warning: JTL file not found at $JTL_FILE or $JTL_FILE_TEMP"
          fi
          
          # Check if report directory has content
          if [ -d "$REPORT_DIR" ] && [ "$(ls -A $REPORT_DIR)" ]; then
            echo "✅ Report directory populated: $REPORT_DIR"
            echo "Report contents:"
            ls -lh "$REPORT_DIR" | head -20
          else
            echo "⚠️ Warning: Report directory is empty or missing"
          fi
          
          # Store exit code for later use
          echo "test_exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "test_failed=$([ $EXIT_CODE -ne 0 ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          # Exit with error code if test failed (but allow job to continue for artifact collection)
          exit $EXIT_CODE
        continue-on-error: true

      - name: Check test results
        if: steps.jmeter.outcome != 'success'
        run: |
          echo "❌ Test ${{ steps.prepare.outputs.test_name }} FAILED"
          echo "Exit code: ${{ steps.jmeter.outputs.test_exit_code }}"
          if [ -d "${{ steps.prepare.outputs.report_dir }}" ]; then
            echo "Reports available in: ${{ steps.prepare.outputs.report_dir }}"
            ls -la "${{ steps.prepare.outputs.report_dir }}/" || true
            # Show last few lines of JMeter log if available
            if [ -f "${{ steps.prepare.outputs.report_dir }}/jmeter.log" ]; then
              echo "Last 20 lines of JMeter log:"
              tail -20 "${{ steps.prepare.outputs.report_dir }}/jmeter.log" || true
            fi
          fi

      - name: Upload test reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-run${{ github.run_number }}
          path: |
            ${{ steps.prepare.outputs.report_dir }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Mark job as failed if test failed
        # This step MUST run without continue-on-error to ensure the job fails when tests fail
        # Without this, continue-on-error: true on the JMeter step would mask failures
        if: steps.jmeter.outcome != 'success'
        run: |
          echo "❌ Test ${{ steps.prepare.outputs.test_name }} failed."
          echo "Exit code from JMeter: ${{ steps.jmeter.outputs.test_exit_code }}"
          echo "Failing this job to ensure test failures are visible in the workflow result."
          exit 1

  summary:
    name: Test Summary
    needs: [discover-tests, jmeter-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Display test summary
        run: |
          echo "## 📊 JMeter Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Tests Found:** ${{ needs.discover-tests.outputs.test_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Files Executed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ join(fromJson(needs.discover-tests.outputs.test_files), '\n') }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check the actual job result - this will now correctly reflect test failures
          if [ "${{ needs.jmeter-tests.result }}" == "success" ]; then
            echo "**Status:** ✅ All tests completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.jmeter-tests.result }}" == "failure" ]; then
            echo "**Status:** ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.jmeter-tests.result }}" == "cancelled" ]; then
            echo "**Status:** ⚠️ Tests were cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Tests completed with status: ${{ needs.jmeter-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports:** Available as separate artifacts for each test" >> $GITHUB_STEP_SUMMARY

